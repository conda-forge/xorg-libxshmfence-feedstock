{% set xorg_name = "libxshmfence" %}
{% set xorg_category = "lib" %}
{% set name = "xorg-" ~ xorg_name %}
{% set version = "1.3.3" %}
{% set sha256 = "6233ccd9fa80198835efc3039cdf8086ab2b218b17e77ebdb0a19913fcee58d3" %}
{% set am_version = "1.16" %} # keep synchronized with build.sh

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://www.x.org/releases/individual/{{ xorg_category }}/{{ xorg_name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}
  patches:
    - windows.patch  # [win and x86_64]
    - win-arm64-msvc.patch  # [win and arm64]

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name|lower) }}

requirements:
  build:
    - m2-autoconf                  # [win and x86_64]
    - m2-automake{{ am_version }}  # [win and x86_64]
    - m2-libtool                   # [win and x86_64]
    - autotools_clang_conda >=0.0.14  # [win and arm64]
    - pkg-config                   # [win and arm64]
    - pkg-config                   # [unix]
    - m2-pkg-config                # [win]
    - gnuconfig                    # [unix]
    - m2-base                      # [win and x86_64]
    - make                         # [unix]
    - m2-make                      # [win and x86_64]
    - {{ stdlib("c") }}            # [unix]
    - {{ compiler("c") }}          # [unix]
    - {{ stdlib("c") }}            # [win and arm64]
    - {{ compiler("c") }}          # [win and arm64]
    - {{ stdlib("m2w64_c") }}      # [win and x86_64]
    - {{ compiler("m2w64_c") }}    # [win and x86_64]
    - autoconf                     # [unix]
    - automake                     # [unix]
    - gettext                      # [unix]
    - libtool                      # [unix]
  host:
    - xorg-xorgproto
    - xorg-util-macros

test:
  requires:
    - {{ compiler("c") }}  # [win and arm64]
    - xorg-xorgproto       # [win and arm64]
  files:
    - test_xshmfence.c     # [win and arm64]
  commands:
    {% set lib_idents = [ "xshmfence" ] %}
    {% for lib_ident in lib_idents %}
    - test -f $PREFIX/lib/lib{{ lib_ident }}.dylib  # [osx]
    - test -f $PREFIX/lib/lib{{ lib_ident }}.so  # [linux]
    - if not exist %PREFIX%/Library/lib/lib{{ lib_ident }}.dll.a exit /b 1  # [win and x86_64]
    - if not exist %PREFIX%/Library/bin/msys-{{ lib_ident }}-*.dll exit /b 1  # [win and x86_64]
    {% endfor %}
    - if not exist %LIBRARY_INC%\X11\xshmfence.h exit /b 1  # [win and arm64]
    - if not exist %LIBRARY_LIB%\xshmfence.lib exit /b 1  # [win and arm64]
    - if not exist %LIBRARY_BIN%\xshmfence-*.dll exit /b 1  # [win and arm64]
    - if not exist %LIBRARY_LIB%\pkgconfig\xshmfence.pc exit /b 1  # [win and arm64]
    - call %CC% /nologo /MD /W4 /I"%LIBRARY_INC%" test_xshmfence.c /link /LIBPATH:"%LIBRARY_LIB%" xshmfence.lib /OUT:xshmfence_consumer.exe  # [win and arm64]
    - if errorlevel 1 exit /b 1  # [win and arm64]
    - set "PATH=%LIBRARY_BIN%;%PATH%"  # [win and arm64]
    - xshmfence_consumer.exe  # [win and arm64]
    - if errorlevel 1 exit /b 1  # [win and arm64]

about:
  home: https://www.x.org/
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: Shared memory 'SyncFence' synchronization primitive

extra:
  recipe-maintainers:
    - ehfd
